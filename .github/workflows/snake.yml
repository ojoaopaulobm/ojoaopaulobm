name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.gif?color_snake=#CCFC3D&color_dots=#13295A,#2B4A8C,#4A6FB5,#8AA8E0,#FFFFFF&color_background=#0A1A3F
            dist/github-snake.svg?color_snake=#CCFC3D&color_dots=#13295A,#2B4A8C,#4A6FB5,#8AA8E0,#FFFFFF

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
